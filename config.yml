upstreams:
  groups:
    default:
      - 1.1.1.1
      - 8.8.8.8
ports:
  dns: 53
  http: 4000
prometheus:
  enable: true
  path: /metrics
bootstrapDns:
  - 1.1.1.1
blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt
  clientGroupsBlock:
    default:
      - ads
caching:
  minTime: 5m
  maxTime: 30m
